name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r requirements-dev.txt -r requirements-ocr.txt -e .
      - run: ruff check . && ruff format --check .
      - run: mypy
      - run: pytest --cov   # coverage gate (90%) is in pyproject.toml; OCR test runs here
      - name: Benchmark smoke (small corpus, must complete and find known items)
        run: python benchmarks/bench.py --docs 300 --tokens 100 --queries 30 --json | tee bench.json && python -c "import json; assert json.load(open('bench.json'))['known_item_recall_at_1'] >= 0.95"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t docsearch .
      - name: Smoke test the container
        run: |
          docker run -d --name ds -p 8000:8000 docsearch
          for i in $(seq 1 30); do curl -sf localhost:8000/healthz && break; sleep 1; done
          printf 'hello container world' > /tmp/a.txt
          curl -sf -F file=@/tmp/a.txt localhost:8000/v1/documents
          curl -sf 'localhost:8000/v1/search?q=container' | grep -q '"total":1'
