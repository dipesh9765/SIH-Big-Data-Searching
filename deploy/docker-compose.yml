# Local infrastructure for docsearch: `docker compose -f deploy/docker-compose.yml up -d postgres objects`
# Ports are bound to loopback only; the default password is for local development.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: docsearch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docsearch_dev}
      POSTGRES_DB: docsearch
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - synchronous_commit=off   # indexing throughput; a crash loses at most the last commits
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docsearch -d docsearch"]
      interval: 3s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 2g

  # S3-compatible object store for the original files. MinIO's public images were withdrawn, so
  # this uses SeaweedFS (Apache-2.0); the code only speaks the S3 API, so any S3 server works.
  objects:
    image: chrislusf/seaweedfs@sha256:c2658820e763294a9e9de7b36c81e59b879e3459148351aee4e31a126ca64860
    command: server -dir=/data -volume.max=0 -master.volumeSizeLimitMB=256 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    volumes:
      - objectdata:/data
      - ./s3.json:/etc/seaweedfs/s3.json:ro

  # ---- the application (profile "app"): `docker compose --profile app up -d --build` ----------
  api:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      args:
        SEMANTIC: ${DOCSEARCH_SEMANTIC_BUILD:-0}  # 1: include the packages and models for semantic search
    depends_on:
      - postgres
      - objects
    environment: &app-env
      DOCSEARCH_DSN: postgresql://docsearch:${POSTGRES_PASSWORD:-docsearch_dev}@postgres:5432/docsearch
      DOCSEARCH_SCHEMA: ${DOCSEARCH_SCHEMA:-public}
      DOCSEARCH_S3_ENDPOINT: objects:8333
      DOCSEARCH_S3_BUCKET: ${DOCSEARCH_S3_BUCKET:-docsearch}
      DOCSEARCH_API_KEY: ${DOCSEARCH_API_KEY:-}
      DOCSEARCH_SEMANTIC: ${DOCSEARCH_SEMANTIC:-}  # 1 turns on embeddings, semantic and image search
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8000"
    restart: unless-stopped

  # Text/PDF/DOCX/CSV worker: also compacts the index and does housekeeping.
  worker:
    profiles: ["app"]
    image: docsearch-worker
    build: &worker-build
      context: ..
      dockerfile: deploy/Dockerfile.worker
      target: worker
    depends_on:
      - postgres
      - objects
    environment:
      <<: *app-env
    command: ["--kinds", "text", "--compact-interval", "10", "--maintenance-interval", "3600"]
    restart: unless-stopped

  # OCR worker (Tesseract: English, Hindi, Marathi) for images and scanned PDFs.
  worker-ocr:
    profiles: ["app", "ocr"]
    image: docsearch-worker
    build: *worker-build
    depends_on:
      - postgres
      - objects
    environment:
      <<: *app-env
      DOCSEARCH_OCR_LANGS: ${DOCSEARCH_OCR_LANGS:-eng+hin+mar}
    command: ["--kinds", "ocr"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "2"

  # Speech-to-text worker for audio and video (faster-whisper; the model is in the image).
  worker-asr:
    profiles: ["asr"]
    image: docsearch-worker
    build: *worker-build
    depends_on:
      - postgres
      - objects
    environment:
      <<: *app-env
      DOCSEARCH_ASR_LANGUAGE: ${DOCSEARCH_ASR_LANGUAGE:-}
    command: ["--kinds", "asr"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3g
          cpus: "4"

  # Embedding worker for semantic and image search. Also set DOCSEARCH_SEMANTIC=1 and build the API
  # with DOCSEARCH_SEMANTIC_BUILD=1 so it can embed queries.
  worker-embed:
    profiles: ["semantic"]
    image: docsearch-worker
    build: *worker-build
    depends_on:
      - postgres
      - objects
    environment:
      <<: *app-env
    command: ["--kinds", "embed"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g

volumes:
  pgdata:
  objectdata:
